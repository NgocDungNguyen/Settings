<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synonyms – Findter Filter &amp; Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--ff:'Inter',-apple-system,BlinkMacSystemFont,'San Francisco','Segoe UI',sans-serif;
--bg:rgba(241,241,241,1);--sf:#fff;--sf-hov:rgba(247,247,247,1);--sf-act:rgba(243,243,243,1);
--fill:#303030;--fill-hov:#1a1a1a;--fill-t:rgba(0,0,0,.02);
--text:rgba(48,48,48,1);--text2:rgba(97,97,97,1);--textd:rgba(181,181,181,1);--lnk:rgba(0,91,211,1);
--bdr:rgba(227,227,227,1);--bdr-foc:rgba(0,91,211,1);--crit:rgba(181,38,11,1);
--r1:4px;--r2:8px;--r3:12px;
--sh1:0px 1px 0px 0px rgba(26,26,26,.07);
--sh3:0px 4px 6px -2px rgba(26,26,26,.2);
--shbtn:0px -1px 0px 0px #b5b5b5 inset,0px 0px 0px 1px rgba(0,0,0,.1) inset,0px .5px 0px 1.5px #fff inset;
--shbtn-hov:0px 1px 0px 0px #ebebeb inset,-1px 0px 0px 0px #ebebeb inset,1px 0px 0px 0px #ebebeb inset,0px -1px 0px 0px #ccc inset;
--shbtnp:0px -1px 0px 1px rgba(0,0,0,.8) inset,0px 0px 0px 1px rgba(48,48,48,1) inset,0px .5px 0px 1.5px rgba(255,255,255,.25) inset;
--shbtnp-hov:0px 1px 0px 0px rgba(255,255,255,.24) inset,1px 0px 0px 0px rgba(255,255,255,.2) inset,-1px 0px 0px 0px rgba(255,255,255,.2) inset,0px -1px 0px 0px #000 inset;
}
html,body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;min-height:100vh}
a{color:var(--lnk)}
.lay{display:flex;min-height:100vh}
.sb{width:248px;background:var(--sf);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s;min-height:100vh}
.sb.col{width:56px}
.sb-hd{padding:12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);gap:8px;overflow:hidden}
.sb-logo{width:28px;height:28px;border-radius:6px;background:var(--fill);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-title{font-size:13px;font-weight:650;color:var(--text);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sb-tgl{width:28px;height:28px;border:none;background:transparent;cursor:pointer;border-radius:var(--r1);display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.sb-tgl:hover{background:var(--sf-hov)}
.sb-nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-btn{width:100%;border:none;background:transparent;cursor:pointer;padding:6px 12px;border-radius:var(--r2);font-family:var(--ff);font-size:13px;font-weight:450;color:var(--text2);text-align:left;display:flex;align-items:center;overflow:hidden;transition:background .1s,color .1s;white-space:nowrap}
.nav-btn:hover:not([disabled]){background:var(--sf-hov);color:var(--text)}
.nav-btn.act{background:var(--sf-act)!important;color:var(--text)!important;font-weight:650}
.nav-btn[disabled]{color:var(--textd)!important;cursor:not-allowed}
.nav-more{width:100%;border:none;background:transparent;cursor:pointer;padding:4px 12px;font-family:var(--ff);font-size:12px;color:var(--textd);text-align:left;display:flex;align-items:center;gap:4px;transition:color .1s;white-space:nowrap}
.nav-more:hover{color:var(--text2)}
.nav-sp{flex:1;min-height:4px}
.nav-sep{height:1px;background:var(--bdr);margin:2px 0;flex-shrink:0}
.nav-lbl{overflow:hidden;text-overflow:ellipsis}
.main{flex:1;overflow-x:hidden}
.pg{max-width:960px;margin:0 auto;padding:24px}
.ic{width:16px;height:16px;fill:currentColor;display:block;flex-shrink:0}
.ic-xl{width:40px;height:40px;fill:currentColor;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 16px;height:32px;border-radius:var(--r2);font-family:var(--ff);font-size:13px;font-weight:550;cursor:pointer;border:none;white-space:nowrap;transition:box-shadow .1s,background .1s}
.btn-p{background:var(--fill);color:#fff;box-shadow:var(--shbtnp)}
.btn-p:hover{background:var(--fill-hov);box-shadow:var(--shbtnp-hov)}
.btn-s{background:var(--sf);color:var(--text);box-shadow:var(--shbtn)}
.btn-s:hover{box-shadow:var(--shbtn-hov)}
.ibtn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);cursor:pointer;border:1px solid var(--bdr);background:var(--sf);color:var(--text2);box-shadow:var(--sh1);transition:background .1s,color .1s,border-color .1s;flex-shrink:0}
.ibtn:hover{background:var(--sf-hov)}
.ibtn-del:hover{background:rgba(181,38,11,.06);color:var(--crit);border-color:rgba(181,38,11,.3)}
.back-a{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r2);text-decoration:none;border:1px solid var(--bdr);background:var(--sf);color:var(--text2);box-shadow:var(--sh1);flex-shrink:0;transition:background .1s}
.back-a:hover{background:var(--sf-hov)}
.card{background:var(--sf);border-radius:var(--r2);box-shadow:var(--sh3);overflow:visible}
.inp{width:100%;border:1px solid var(--bdr);border-radius:var(--r2);padding:7px 12px;font-family:var(--ff);font-size:13px;color:var(--text);background:var(--sf);outline:none;transition:border-color .1s,box-shadow .1s}
.inp::placeholder{color:var(--textd)}
.inp:focus{border-color:var(--bdr-foc);box-shadow:0 0 0 3px rgba(0,91,211,.2)}
.flbl{font-size:13px;font-weight:550;color:var(--text);display:block;margin-bottom:2px}
.fhint{font-size:12px;color:var(--text2);margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.mo{background:var(--sf);border-radius:var(--r3);box-shadow:0 4px 24px rgba(0,0,0,.3);width:100%;max-width:460px;overflow:hidden;animation:mIn .15s ease-out}
@keyframes mIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.mo-hd{padding:16px 20px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center}
.mo-ttl{font-size:14px;font-weight:650}
.mo-bd{padding:20px;display:flex;flex-direction:column;gap:16px}
.mo-ft{padding:12px 20px;border-top:1px solid var(--bdr);background:var(--fill-t);display:flex;justify-content:flex-end;gap:8px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r1);background:var(--sf-act);font-size:12px;font-weight:550;color:var(--text)}
.bnr{border-radius:var(--r2);padding:12px 16px;display:flex;align-items:flex-start;gap:10px;font-size:13px;background:#e8f4fe;border:1px solid rgba(0,91,211,.2);color:#003d9c}
.hidden{display:none!important}
.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}
.frow{display:flex;gap:8px;align-items:center}.fbe{justify-content:space-between}.fend{justify-content:flex-end}
.tgl{position:relative;display:inline-block;width:36px;height:20px;border:none;padding:0;cursor:pointer;border-radius:10px;outline:none;appearance:none;-webkit-appearance:none;transition:background .2s;flex-shrink:0;vertical-align:middle}
.tgl:focus-visible{box-shadow:0 0 0 3px rgba(0,91,211,.25)}
.tgl.on{background:var(--fill)}.tgl.off{background:rgba(204,204,204,1)}
.tgl-th{display:block;position:absolute;top:2.5px;left:2.5px;width:15px;height:15px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s;pointer-events:none}
.tgl.on .tgl-th{transform:translateX(16px)}
.tbl-hd{display:grid;grid-template-columns:1fr 2fr 2fr 4fr 1fr;gap:10px;padding:8px 16px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.02em;color:var(--textd);border-bottom:1px solid var(--bdr)}
.tbl-row{display:grid;grid-template-columns:1fr 2fr 2fr 4fr 1fr;gap:10px;align-items:center;padding:10px 16px}
.rel-notation{font-size:13px;font-weight:650;color:var(--text);white-space:nowrap}
.tt-wrap{position:relative;display:inline-flex;align-items:center;text-transform:none}
.tt-ic{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.14);color:inherit;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:default;font-style:normal;text-transform:none}
.tt-panel{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:300px;background:#1a1a1a;color:#fff;font-size:12px;line-height:1.55;padding:12px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:opacity .12s;z-index:70;text-align:left;font-weight:450;text-transform:none;letter-spacing:normal}
.tt-panel b{display:block;color:#fff;font-weight:650}
.tt-panel .tt-eg{color:#c9c9c9}
.tt-panel::after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:#1a1a1a}
.tt-wrap:hover .tt-panel{opacity:1;visibility:visible}
.rel-opt{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 12px;font-size:13px;font-weight:600;color:var(--text);border:1px solid var(--bdr);border-radius:var(--r2);cursor:pointer;background:var(--sf);transition:border-color .1s,background .1s}
.rel-opt:hover{background:var(--sf-hov)}
.rel-opt.sel{border-color:var(--bdr-foc);background:#e8f4fe}
</style>
</head>
<body>
<div class="lay">
  <aside class="sb" id="sidebar">
    <div class="sb-hd">
      <a href="index.html" style="display:flex;align-items:center;gap:8px;flex:1;text-decoration:none;overflow:hidden;min-width:0;color:inherit" title="Home"><div class="sb-logo">Fd</div><span class="sb-title nav-lbl">Findter Filter &amp; Search</span></a>
      <button class="sb-tgl" id="sidebar-toggle" title="Toggle sidebar">
        <span id="toggle-icon"><svg class="ic" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.78 5.97a.75.75 0 0 1 0 1.06L8.81 10l2.97 2.97a.75.75 0 1 1-1.06 1.06l-3.5-3.5a.75.75 0 0 1 0-1.06l3.5-3.5a.75.75 0 0 1 1.06 0Z" fill="currentColor"/></svg></span>
      </button>
    </div>
    <div class="sb-nav" id="nav"></div>
  </aside>
  <main class="main">
    <div class="pg">
      <div style="display:flex;align-items:center;gap:12px">
        <a href="Search.html" class="back-a" title="Back to Search">
          <svg class="ic" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75H5.56l2.72 2.72a.75.75 0 1 1-1.06 1.06l-4-4a.75.75 0 0 1 0-1.06l4-4a.75.75 0 0 1 1.06 1.06L5.56 9.25H16.25A.75.75 0 0 1 17 10Z" fill="currentColor"/></svg>
        </a>
        <div>
          <h1 style="font-size:1.25rem;font-weight:650;line-height:1.3">Synonyms</h1>
          <p style="font-size:13px;color:var(--text2);margin-top:2px">Define word groups so shoppers find products even when using different terms.</p>
        </div>
      </div>


      <div id="add-row" class="frow fbe mt5">
        <span id="group-count" style="font-size:13px;color:var(--text2)"></span>
        <button id="add-btn" class="btn btn-p">
          <svg class="ic" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75h-5.5v5.5a.75.75 0 0 1-1.5 0v-5.5h-5.5a.75.75 0 0 1 0-1.5h5.5v-5.5a.75.75 0 0 1 1.5 0v5.5h5.5A.75.75 0 0 1 17 10Z" fill="currentColor"/></svg>
          Add Synonym
        </button>
      </div>

      <div id="synonym-list" class="card mt3"></div>
    </div>
  </main>
</div>

<!-- Modal -->
<div id="synonym-modal" class="ov hidden">
  <div class="mo">
    <div class="mo-hd">
      <span class="mo-ttl" id="modal-title">Add Synonym Group</span>
      <button id="modal-close" class="ibtn" style="border:none;box-shadow:none;background:transparent">
        <svg class="ic" viewBox="0 0 20 20"><path d="m11.06 10 3.22-3.22a.75.75 0 0 0-1.06-1.06L10 8.94 6.78 5.72a.75.75 0 0 0-1.06 1.06L8.94 10l-3.22 3.22a.75.75 0 1 0 1.06 1.06L10 11.06l3.22 3.22a.75.75 0 1 0 1.06-1.06L11.06 10Z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="mo-bd">
      <div>
        <label class="flbl" for="modal-keyword">Search Term</label>
        <input id="modal-keyword" type="text" placeholder="e.g. sofa" class="inp">
        <p class="fhint" style="margin-top:4px;margin-bottom:0">The word or phrase your shopper types in the search box.</p>
      </div>
      <div>
        <label class="flbl">Relation</label>
        <div id="modal-rel" style="display:flex;gap:8px"></div>
      </div>
      <div>
        <label class="flbl" for="modal-synonyms">Synonyms</label>
        <input id="modal-synonyms" type="text" placeholder="e.g. couch, settee, divan" class="inp">
      </div>
      <div id="modal-preview" style="font-size:12px;background:var(--fill-t);border-radius:var(--r1);padding:8px 10px"></div>
      <p id="modal-error" class="hidden" style="font-size:12px;color:var(--crit)"></p>
    </div>
    <div class="mo-ft">
      <button id="modal-cancel" class="btn btn-s">Cancel</button>
      <button id="modal-save" class="btn btn-p">Save</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);

// ── localStorage helpers ──
const LS_KEY='findter_synonyms';
function lsLoad(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function lsSave(d){try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch(e){}}

const IC={
  chevL:`<svg class="ic" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.78 5.97a.75.75 0 0 1 0 1.06L8.81 10l2.97 2.97a.75.75 0 1 1-1.06 1.06l-3.5-3.5a.75.75 0 0 1 0-1.06l3.5-3.5a.75.75 0 0 1 1.06 0Z" fill="currentColor"/></svg>`,
  chevR:`<svg class="ic" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.22 5.97a.75.75 0 0 0 0 1.06L11.19 10 8.22 12.97a.75.75 0 1 0 1.06 1.06l3.5-3.5a.75.75 0 0 0 0-1.06l-3.5-3.5a.75.75 0 0 0-1.06 0Z" fill="currentColor"/></svg>`,
  edit:`<svg class="ic" viewBox="0 0 20 20"><path d="m11.47 3.87 4.7 4.7-8.5 8.5H3.01l-.01-4.63 8.47-8.57Zm1.06-1.06 1.94-1.94a1.5 1.5 0 0 1 2.12 0l2.55 2.55a1.5 1.5 0 0 1 0 2.12l-1.94 1.94-4.67-4.67Z" fill="currentColor"/></svg>`,
  del:`<svg class="ic" viewBox="0 0 20 20"><path d="M14 4h3a1 1 0 0 1 0 2h-1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6H3a1 1 0 0 1 0-2h3V2.5A1.5 1.5 0 0 1 7.5 1h5A1.5 1.5 0 0 1 14 2.5V4ZM8.5 2.5v1.5h3V2.5h-3ZM6 6v10h8V6H6Zm2 2.5a.5.5 0 0 1 1 0v5a.5.5 0 0 1-1 0v-5Zm3 0a.5.5 0 0 1 1 0v5a.5.5 0 0 1-1 0v-5Z" fill="currentColor"/></svg>`,
  tags:`<svg style="width:40px;height:40px;fill:var(--textd);display:block" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M1 2.5A1.5 1.5 0 0 1 2.5 1h5a1.5 1.5 0 0 1 1.06.44l10 10a1.5 1.5 0 0 1 0 2.12l-5 5a1.5 1.5 0 0 1-2.12 0l-10-10A1.5 1.5 0 0 1 1 7.5v-5ZM5 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" fill="currentColor"/></svg>`,
};
const NAV_MAIN=[
  {id:'filter',   label:'Filter'},
  {id:'search',   label:'Search'},
  {id:'settings', label:'Settings'},
  {id:'ymm',      label:'Year Make Model'},
  {id:'advanced', label:'Advanced Feature'},
  {id:'analytics',label:'Analytics'},
];
const NAV_MORE_ITEMS=[{id:'subscription',label:'Subscription'}];
const NAV_BTM={id:'storefront',label:'Storefront Preview'};
const ENABLED=new Set(['filter','search','settings','ymm','advanced','storefront']);
const ACTIVE='search';
let col=false;
let navExp=false;
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderNav(){
  function nb(n,act,en,style){return`<button data-nav="${n.id}"${en?'':' disabled'} class="nav-btn${act?' act':''}" title="${n.label}"${style?` style="${style}"`:''}><span class="nav-lbl">${escapeHtml(n.label)}</span></button>`;}
  const main=NAV_MAIN.map(n=>nb(n,n.id===ACTIVE,ENABLED.has(n.id))).join('');
  const tgl=`<button id="nav-exp" class="nav-more"><span class="nav-lbl">${navExp?'View less':'View more'}</span><svg style="flex-shrink:0;transition:transform .2s;transform:rotate(${navExp?180:0}deg)" width="10" height="10" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"/></svg></button>`;
  const more=navExp?NAV_MORE_ITEMS.map(n=>nb(n,n.id===ACTIVE,ENABLED.has(n.id),'padding-left:24px')).join(''):'';
  const btm=nb(NAV_BTM,NAV_BTM.id===ACTIVE,ENABLED.has(NAV_BTM.id));
  $('nav').innerHTML=main+more+btm+`<div class="nav-sep" style="margin-top:auto;flex-shrink:0"></div>`+tgl;
  $('nav').querySelectorAll('[data-nav]').forEach(b=>{
    if(!ENABLED.has(b.dataset.nav))return;
    b.onclick=()=>{
      const v=b.dataset.nav;
      if(v==='settings')location.href='Settings.html';
      else if(v==='search')location.href='Search.html';
      else if(v==='filter')location.href='Filter.html';
      else if(v==='ymm')location.href='YearMakeModel.html';
      else if(v==='advanced')location.href='Advanced_Feature.html';
      else if(v==='storefront')location.href='StoreFront.html';
    };
  });
  const expBtn=$('nav-exp');
  if(expBtn)expBtn.onclick=()=>{navExp=!navExp;renderNav();updateSb();};
  updateSb();
}
function updateSb(){
  $('sidebar').classList.toggle('col',col);
  $('sidebar').querySelectorAll('.nav-lbl').forEach(el=>el.classList.toggle('hidden',col));
  document.querySelector('.sb-title').classList.toggle('hidden',col);
  $('toggle-icon').innerHTML=col?IC.chevR:IC.chevL;
  const expBtn=$('nav-exp');if(expBtn)expBtn.style.display=col?'none':'';
}
$('sidebar-toggle').onclick=()=>{col=!col;updateSb();};

const REL_INFO={
  oneway:{label:'One-way (=>)',notation:'=>'},
  twoway:{label:'Two-ways (<=>)',notation:'<=>'},
};
const REL_HD_TOOLTIP=`<b>One-way (=>)</b><br>Searching the <i>Search Term</i> also returns results for its synonyms, but not the reverse.<br><span class="tt-eg">e.g. Typing "tv" also shows television results. Typing "television" won't show "tv" results.</span><br><br><b>Two-ways (&lt;=&gt;)</b><br>All terms are equal. Searching any one returns results for all of them.<br><span class="tt-eg">e.g. "sneakers" &lt;=&gt; "trainers": searching either one finds both.</span>`;
function relBadge(rel){rel=REL_INFO[rel]?rel:'twoway';return`<span class="rel-notation">${escapeHtml(REL_INFO[rel].notation)}</span>`;}

const _DEFAULT_GROUPS=[
  {id:1,keyword:'t-shirt', relation:'twoway', synonyms:['tee','shirt','top','polo'], enabled:true},
  {id:2,keyword:'Ipone',   relation:'oneway', synonyms:['iPhone'], enabled:true},
];
let synonymGroups=_DEFAULT_GROUPS.map(g=>({...g,synonyms:[...g.synonyms]}));
let editingId=null,nextId=3;

// migrates pre-relation records (array `queries`, missing `relation`, or missing `enabled`) to the current shape
function migrateGroup(g){
  if(typeof g.keyword==='string')return{...g,relation:g.relation==='oneway'?'oneway':'twoway',enabled:g.enabled!==false};
  const q=Array.isArray(g.queries)?g.queries.filter(Boolean):[];
  const keyword=q[0]||g.synonyms?.[0]||'';
  const rest=[...q.slice(1),...(g.synonyms||[])].filter(w=>w&&w.trim().toLowerCase()!==keyword.trim().toLowerCase());
  const seen=new Set();
  const synonyms=rest.filter(w=>{const n=w.trim().toLowerCase();if(seen.has(n))return false;seen.add(n);return true;});
  return{id:g.id,keyword,relation:'twoway',synonyms,enabled:true}; // old groups were always fully mutual and active
}

// load from localStorage
(()=>{const s=lsLoad();if(s&&s.length){synonymGroups=s.map(migrateGroup).filter(g=>g.keyword&&g.synonyms.length);nextId=Math.max(...s.map(g=>g.id),0)+1;lsSave(synonymGroups);}})();

let selectedRelation='twoway';
function renderRelPicker(){
  $('modal-rel').innerHTML=Object.keys(REL_INFO).map(rel=>{
    const r=REL_INFO[rel];
    return`<div class="rel-opt${rel===selectedRelation?' sel':''}" data-rel="${rel}">${escapeHtml(r.label)}</div>`;
  }).join('');
  $('modal-rel').querySelectorAll('.rel-opt').forEach(el=>{
    el.onclick=()=>{selectedRelation=el.dataset.rel;renderRelPicker();updateModalDynamic();};
  });
}

// Live preview under the Synonyms field, driven by the current form values. Capped to a handful
// of sample lines — beyond that, the pattern already repeats, so more lines add noise, not clarity.
const PREVIEW_SAMPLE_CAP=3;
function updateModalDynamic(){
  const kw=($('modal-keyword').value||'').trim();
  const syns=parseTags($('modal-synonyms').value);
  const kwDisp=kw||'Search Term';
  if(!kw&&!syns.length){$('modal-preview').innerHTML='';return;}
  const synList=syns.length?syns.map(s=>`"${escapeHtml(s)}"`).join(', '):'…';
  let header,lines;
  if(selectedRelation==='oneway'){
    header=`"${escapeHtml(kwDisp)}" → ${synList}`;
    const allTerms=[kwDisp,...syns].map(escapeHtml).join(', ');
    lines=[`Search "${escapeHtml(kwDisp)}" → Returns ${allTerms}`,
      ...syns.slice(0,PREVIEW_SAMPLE_CAP).map(s=>`Search "${escapeHtml(s)}" → Returns ${escapeHtml(s)}`)];
    if(syns.length>PREVIEW_SAMPLE_CAP)lines.push('...');
  }else{
    const full=[kwDisp,...syns];
    header=full.map(s=>`"${escapeHtml(s)}"`).join(' ⇄ ');
    const allTerms=full.map(escapeHtml).join(', ');
    lines=full.slice(0,PREVIEW_SAMPLE_CAP+1).map(t=>`Search "${escapeHtml(t)}" → Returns ${allTerms}`);
    if(full.length>PREVIEW_SAMPLE_CAP+1)lines.push('...');
  }
  $('modal-preview').innerHTML=`<b>Preview:</b> ${header}<br><span style="color:var(--text2)">${lines.join('<br>')}</span>`;
}

function renderGroups(){
  const list=$('synonym-list');
  const count=synonymGroups.length;
  $('group-count').textContent=count===0?'':`${count} synonym group${count!==1?'s':''}`;
  $('add-row').classList.toggle('hidden',count===0);
  if(count===0){
    list.innerHTML=`<div style="padding:56px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
      ${IC.tags}
      <p style="font-weight:550;color:var(--text2);margin-top:4px">No synonyms yet</p>
      <p style="font-size:12px;color:var(--textd);max-width:320px;text-align:center">Add synonyms to help shoppers find products even when they search with different words, typos, or abbreviations.</p>
      <button id="add-btn-empty" class="btn btn-p">
        <svg class="ic" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75h-5.5v5.5a.75.75 0 0 1-1.5 0v-5.5h-5.5a.75.75 0 0 1 0-1.5h5.5v-5.5a.75.75 0 0 1 1.5 0v5.5h5.5A.75.75 0 0 1 17 10Z" fill="currentColor"/></svg>
        Add Synonym
      </button>
    </div>`;
    $('add-btn-empty').onclick=()=>openModal();
    return;
  }
  const hd=`<div class="tbl-hd"><span>Status</span><span>Search Term</span><span style="display:flex;align-items:center;justify-content:center;gap:4px">Relation<span class="tt-wrap"><span class="tt-ic">i</span><span class="tt-panel">${REL_HD_TOOLTIP}</span></span></span><span>Synonyms</span><span>Action</span></div>`;
  list.innerHTML=hd+`<div>${synonymGroups.map((g,i)=>`
    <div class="tbl-row" style="${i<synonymGroups.length-1?'border-bottom:1px solid var(--bdr)':''}">
      <div><button data-toggle="${g.id}" class="tgl ${g.enabled?'on':'off'}" title="${g.enabled?'Enabled':'Disabled'}"><span class="tgl-th"></span></button></div>
      <div style="min-width:0"><span class="tag" style="font-weight:650">${escapeHtml(g.keyword)}</span></div>
      <div style="min-width:0;text-align:center">${relBadge(g.relation)}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;min-width:0">
        ${g.synonyms.map(w=>`<span class="tag">${escapeHtml(w)}</span>`).join('')}
      </div>
      <div style="display:flex;gap:6px;justify-content:flex-start">
        <button data-edit="${g.id}" class="ibtn" title="Edit">${IC.edit}</button>
        <button data-delete="${g.id}" class="ibtn ibtn-del" title="Delete">${IC.del}</button>
      </div>
    </div>`).join('')}</div>`;
  list.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleGroupEnabled(+b.dataset.toggle));
  list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(+b.dataset.edit));
  list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteGroup(+b.dataset.delete));
}
function toggleGroupEnabled(id){const g=synonymGroups.find(g=>g.id===id);if(!g)return;g.enabled=!g.enabled;lsSave(synonymGroups);renderGroups();}

function openModal(id=null){
  editingId=id;
  $('modal-title').textContent=id===null?'Add Synonym Group':'Edit Synonym Group';
  $('modal-error').classList.add('hidden');
  if(id!==null){const g=synonymGroups.find(g=>g.id===id);$('modal-keyword').value=g.keyword;$('modal-synonyms').value=g.synonyms.join(', ');selectedRelation=g.relation||'twoway';}
  else{$('modal-keyword').value='';$('modal-synonyms').value='';selectedRelation='twoway';}
  renderRelPicker();
  updateModalDynamic();
  $('synonym-modal').classList.remove('hidden');
  setTimeout(()=>$('modal-keyword').focus(),50);
}
function closeModal(){$('synonym-modal').classList.add('hidden');editingId=null;}

function parseTags(str){return str.split(',').map(s=>s.trim()).filter(Boolean);}
function normWord(s){return s.trim().toLowerCase();}

// Validates + normalizes a keyword/relation/synonyms set against the rest of the groups.
// Returns {keyword,relation,synonyms} on success, or a string error message on failure.
function validateSynGroup(keywordRaw,relation,synonymsRaw,editingId,groups){
  if(relation!=='oneway'&&relation!=='twoway')relation='twoway';
  // tolerate a stray trailing/leading comma (leftover habit from the old multi-keyword field) without blocking save
  const keyword=(keywordRaw||'').trim().replace(/^,+|,+$/g,'').trim();
  if(!keyword)return'Please enter a Search Term.';
  if(keyword.includes(','))return`Only one Search Term is allowed per group. "${keywordRaw.trim()}" looks like more than one word — put the extra words in the Synonyms field instead.`;
  const keyN=normWord(keyword);

  let synonyms=parseTags(synonymsRaw);
  if(!synonyms.length)return'Please enter at least one synonym.';
  const seen=new Set();
  synonyms=synonyms.filter(w=>{const n=normWord(w);if(seen.has(n))return false;seen.add(n);return true;}); // de-dupe within this group, case-insensitive
  synonyms=synonyms.filter(w=>normWord(w)!==keyN); // a synonym identical to its own Search Term is redundant
  if(!synonyms.length)return'The Search Term and Synonyms need to be different words.';

  // A term can appear in multiple groups, and the same word can be a Search Term in one group and a
  // synonym in another — the only thing we guard against is literally duplicating a Search Term.
  const others=groups.filter(g=>g.id!==editingId);
  const dupKeyword=others.find(g=>normWord(g.keyword)===keyN);
  if(dupKeyword)return`"${keyword}" is already the Search Term of another group.`;

  return{keyword,relation,synonyms};
}

function saveModal(){
  const result=validateSynGroup($('modal-keyword').value,selectedRelation,$('modal-synonyms').value,editingId,synonymGroups);
  if(typeof result==='string'){$('modal-error').textContent=result;$('modal-error').classList.remove('hidden');return;}
  if(editingId!==null){const g=synonymGroups.find(g=>g.id===editingId);g.keyword=result.keyword;g.relation=result.relation;g.synonyms=result.synonyms;}
  else{synonymGroups.push({id:nextId++,keyword:result.keyword,relation:result.relation,synonyms:result.synonyms,enabled:true});}
  lsSave(synonymGroups);
  closeModal();renderGroups();
}
function deleteGroup(id){synonymGroups=synonymGroups.filter(g=>g.id!==id);lsSave(synonymGroups);renderGroups();}

$('add-btn').onclick=()=>openModal();
$('modal-close').onclick=$('modal-cancel').onclick=closeModal;
$('modal-save').onclick=saveModal;
$('synonym-modal').addEventListener('click',e=>{if(e.target.id==='synonym-modal')closeModal();});
$('modal-keyword').addEventListener('input',e=>{if(e.target.value.includes(',')){e.target.value=e.target.value.replace(/,/g,'');}updateModalDynamic();});
$('modal-keyword').addEventListener('keydown',e=>{if(e.key===',')e.preventDefault();else if(e.key==='Enter')$('modal-synonyms').focus();});
$('modal-synonyms').addEventListener('input',updateModalDynamic);
$('modal-synonyms').addEventListener('keydown',e=>{if(e.key==='Enter')saveModal();});

renderNav();renderGroups();
</script>
